<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<f:view>
    <h:head>
        <title>Query rides</title>
        <h:outputStylesheet name="css/style.css" />
    </h:head>
    <h:body>
        
        <div class="form-container">
            <h2>Query ride</h2>
            <h:messages globalOnly="true" layout="list" styleClass="message-container" />
            
            <h:form id="formularioBusqueda">
                
                <label for="departCity">Depart city:</label>
                <p:selectOneMenu id="departCity" value="#{queryRides.departCity}">
                    <f:selectItems value="#{queryRides.departCities}" />
                    <p:ajax event="change" listener="#{queryRides.departCitySelected}" 
                            process="@this"
                            update="destinationCity"/>
                </p:selectOneMenu>

                <label for="destinationCity">Destination city:</label>
                <p:selectOneMenu id="destinationCity" value="#{queryRides.destinationCity}">
                    <f:selectItems value="#{queryRides.destinationCities}" />
                </p:selectOneMenu>

                <label for="rideDate">Ride date:</label>
                <p:calendar id="rideDate" value="#{queryRides.rideDate}" navigator="true" pattern="dd/MM/yyyy" mode="inline" />
                
                <div class="button-container">
                    <p:commandButton value="Search" action="#{queryRides.doSearch}" 
                                     process="@form" 
                                     update=":formularioTabla:foundRides"
                                     styleClass="ui-button" />

                    <h:button value="Back" outcome="DriverMenu" />
                </div>
            </h:form>
        </div>

        <div class="form-container">
            <h2>Found rides:</h2>
            <h:form id="formularioTabla">
                <p:dataTable id="foundRides" value="#{queryRides.foundRides}" var="item" border="1" emptyMessage="Select filters and press Search.">
                    <p:column headerText="Driver">#{item.driver.name}</p:column>
                    <p:column headerText="Seats">#{item.nPlaces}</p:column>
                    <p:column headerText="Price">#{item.price}</p:column>
                </p:dataTable>
            </h:form>
        </div>

    </h:body>
</f:view>
</html>
